
name: CART3R Snake APK Builder

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          echo "Searching for project ZIP..."

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f -iname "*.zip" \
            -not -path "*/.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -o "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted"

          PROJECT_FILE=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project located at: $PROJECT_DIR"

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Compiling Snake Android..."

          gradle --no-daemon assembleDebug

          echo "Searching for APK..."

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*/*.apk" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK generated."
            find "$PROJECT_DIR" -type d -name outputs
            exit 1
          fi

          echo "APK FOUND: $APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/apk-output/CART3R-Snake.apk"

          echo "APK READY!"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CART3R-Snake-APK
          path: apk-output/CART3R-Snake.apk
          if-no-files-found: error
          retention-days: 7
